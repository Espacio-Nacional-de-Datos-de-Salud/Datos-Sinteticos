services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: synthetic-data-backend
    environment:
      - PYTHONUNBUFFERED=1
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - outputs:/app/outputs
      - ./data:/app/data
      - ./config:/app/config
      - ./mlruns:/app/mlruns
      - ./mlflow.db:/app/mlflow.db
    depends_on:
      - mlflow

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.10.1
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow.db:/mlflow/mlflow.db
      - ./mlruns:/mlflow/mlruns
    command: >
      mlflow server 
      --host 0.0.0.0 
      --port 5000
      --allowed-hosts "*"
#      --default-artifact-root /mlflow/mlruns 

volumes:
    outputs:
