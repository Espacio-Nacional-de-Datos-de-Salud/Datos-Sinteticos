statistics:
  # ============================================================================
  # BUILT-IN STATISTICS
  # ============================================================================
  - operation: "mean"
    table: "dataset_prueba_tecnica_v2"
    col: "gender"

  - operation: "median"
    table: "dataset_prueba_tecnica_v2"
    col: "gender"

  - operation: "mode"
    table: "dataset_prueba_tecnica_v2"
    col: "gender"

  - operation: "variance"
    table: "dataset_prueba_tecnica_v2"
    col: "gender"

  - operation: "skewness"
    table: "dataset_prueba_tecnica_v2"
    col: "gender"

  - operation: "kurtosis"
    table: "dataset_prueba_tecnica_v2"
    col: "gender"


  - operation: "quantile"
    table: "dataset_prueba_tecnica_v2"
    col: "gender"
    quantile: 0.25

  - operation: "quantile"
    table: "dataset_prueba_tecnica_v2"
    col: "gender"
    quantile: 0.75

  # ============================================================================
  # FORMULA-BASED CUSTOM STATISTICS
