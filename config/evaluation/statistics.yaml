  # CUSTOM STATISTICS (from custom_statistics.py module)
  # Uncomment to enable custom statistics. Requires CUSTOM_STATISTICS_MODULE
  # environment variable or configuration to be set.
  # ============================================================================
  
  - operation: "age"
    table: "dataset_prueba_tecnica_v2"
    convert_to_categorical: False
    columns: {"col": "dob", "col2": "admittime"}
   # Additional parameters can be added here if needed by the custom statistic
  # Coefficient of Variation (relative variability, scale-independent)
  # - operation: "coefficient_of_variation"
  #   table: "dataset_prueba_tecnica_v2"
  #   col: "age"

  # Interquartile Range (robust spread measure)
  # - operation: "interquartile_range"
  #   table: "dataset_prueba_tecnica_v2"
  #   col: "age"

  # Proportion of null/missing values
  # - operation: "null_proportion"
  #   table: "dataset_prueba_tecnica_v2"
  #   col: "age"

  # ============================================================================
  # NOTES ON STATISTICS CONFIGURATION
  # ============================================================================
  #
  # 1. BUILT-IN STATISTICS:
  #    - mean, median, mode, variance, skewness, kurtosis, range, quantile
  #    - All compute bootstrap confidence intervals (10,000 resamples at 95% level)
  #
  # 2. FORMULA-BASED STATISTICS (operation: "custom_formula"):
  #    - Use {col} as placeholder for the preprocessed numeric series
  #    - Supported functions: np, pd, min, max, sum, mean, std, var
  #    - Example formulas:
  #      * "np.sqrt({col})" - square root
  #      * "np.log({col})" - natural logarithm
  #      * "({col} - {col}.mean()) / {col}.std()" - standardization
  #      * "{col}.max() - {col}.min()" - range computation
  #    - All formula statistics automatically get bootstrap CI
  #
  # 3. CUSTOM STATISTICS (from custom_statistics.py):
  #    - Enable by setting CUSTOM_STATISTICS_MODULE environment variable
  #    - Example: export CUSTOM_STATISTICS_MODULE="src.evaluation.custom_statistics"
  #    - Available custom stats: coefficient_of_variation, interquartile_range, null_proportion
  #    - Users can extend by creating custom Statistic subclasses
  #
  # 4. CONFIDENCE INTERVALS:
  #    - All statistics compute 95% confidence intervals using bootstrap resampling
  #    - Bootstrap uses 10,000 resamples by default
  #    - Confidence level set in config/general_config.py (CONFIDENCE_INTERVAL_LEVEL)
