      rules_config: "config/rules_person_visit.yaml"
      mostly_ai:
        model_settings:
          max_training_time: 40
          max_epochs: 1000
          batch_size: null
          model: "MOSTLY_AI/Medium"
          enable_flexible_generation: true
    train:
      files:
        - "data/synthea100k-processed/person.parquet"
        - "data/synthea100k-processed/visit_occurrence.parquet"
    simulate:
      sample_size: 50000
