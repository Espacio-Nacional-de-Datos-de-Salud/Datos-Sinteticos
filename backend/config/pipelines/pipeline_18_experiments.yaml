# ─────────────────────────────────────────────────────────────────────────────
# Editable runtime config. Managed by the application (UI / API / `make config`).
# Edits here are persistent until the config is reset to its example template.
# ─────────────────────────────────────────────────────────────────────────────

# =============================================================================
# Pipeline: First systematic experiment — model size, DP, and training settings
#
# IMPORTANT: max_training_time is in MINUTES (not seconds!).
#            The engine converts it to seconds internally.
#            Early stopping (patience=4 epochs) usually triggers first.
#
# Hyperparameter axes explored:
#   - model:                     MOSTLY_AI/Small / Medium / Large
#   - differential_privacy:      none / epsilon=50 (light) / epsilon=10 (medium) / epsilon=5 (strict)
#   - enable_flexible_generation: True (default) / False (better accuracy, no conditional gen)
#   - max_training_time:         20 / 40 / 60 / 90 minutes (per table complexity)
#
# Time budget:
#   - Single table:   20 min
#   - 2-table:        40 min
#   - 3-table:        60 min
#   - 5-table:        90 min
#
# Structure:
#   Block A (jobs 1-9):   prueba_tecnica_v2 — full hyperparameter sweep
#   Block B (jobs 10-13): person + visit_occurrence — representative 2-table
#   Block C (jobs 14-16): 3-table clinical pathway
#   Block D (jobs 17-18): 5-table heavy
#
# Run with:
#   python -m src.pipeline --config config/pipeline_50_experiments.yaml
# =============================================================================

jobs:

  # ===========================================================================
  #  BLOCK A — prueba_tecnica_v2: full hyperparameter sweep  (jobs 1-9)
  #  All use batch_size=null (auto) and max_epochs=1000 (early stopping governs)
  # ===========================================================================

