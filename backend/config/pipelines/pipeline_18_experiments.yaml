  # Job 4: Medium model, no DP, flexible generation OFF (fixed column order — better accuracy)
  - name: "prueba_medium_nodp_noflex"
    config:
      mostly_ai:
        model_settings:
          max_training_time: 20
          max_epochs: 1000
          batch_size: null
          model: "MOSTLY_AI/Medium"
          enable_flexible_generation: false
    train:
      files:
        - "data/dataset_prueba_tecnica_v2.csv"
    simulate:
      sample_size: 50000
    evaluate:
      real_data:
        - "data/dataset_prueba_tecnica_v2.csv"

  # Job 5: Large model, no DP, flexible generation OFF (best quality target)
  - name: "prueba_large_nodp_noflex"
    config:
      mostly_ai:
        model_settings:
          max_training_time: 90
          max_epochs: 1000
          batch_size: null
          model: "MOSTLY_AI/Large"
          enable_flexible_generation: false
    train:
      files:
        - "data/dataset_prueba_tecnica_v2.csv"
    simulate:
      sample_size: 50000
    evaluate:
      real_data:
        - "data/dataset_prueba_tecnica_v2.csv"

  # Job 6: Medium model, DP epsilon=50 (light privacy — minimal quality impact)
  - name: "prueba_medium_dp_eps50"
    config:
      mostly_ai:
        model_settings:
          max_training_time: 20
          max_epochs: 1000
          batch_size: null
          model: "MOSTLY_AI/Medium"
          enable_flexible_generation: true
          differential_privacy:
            max_epsilon: 50
            noise_multiplier: 1.0
    train:
      files:
        - "data/dataset_prueba_tecnica_v2.csv"
    simulate:
      sample_size: 50000
    evaluate:
      real_data:
        - "data/dataset_prueba_tecnica_v2.csv"

  # Job 7: Medium model, DP epsilon=10 (medium privacy)
  - name: "prueba_medium_dp_eps10"
