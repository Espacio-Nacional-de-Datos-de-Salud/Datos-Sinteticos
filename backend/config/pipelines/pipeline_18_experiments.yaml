  # Job 9: Large model, DP epsilon=10 (medium privacy + larger capacity)
  - name: "prueba_large_dp_eps10"
    config:
      mostly_ai:
        model_settings:
          max_training_time: 20
          max_epochs: 1000
          batch_size: null
          model: "MOSTLY_AI/Large"
          enable_flexible_generation: true
