# ─────────────────────────────────────────────────────────────────────────────
# Editable runtime config. Managed by the application (UI / API / `make config`).
# Edits here are persistent until the config is reset to its example template.
# ─────────────────────────────────────────────────────────────────────────────

# Pipeline configuration for automated sequential synthetic data runs.
#
# Each job in the 'jobs' list defines any combination of three steps:
#   - train:    train a new generator on one or more data files
#   - simulate: generate synthetic data using a trained generator
#   - evaluate: evaluate synthetic data quality against real data
#
# Steps within a job run in order (train → simulate → evaluate).
# Artifacts (model_id, generator) produced by earlier steps are passed
# automatically to later steps in the same job.
# Any step can be omitted — only the ones present will run.
#
# Each job can optionally include a 'config' section to override:
#   - rules_config:  path to a job-specific rules YAML file
#   - mostly_ai:     deep-merge overrides for mostly_ai.yaml
#   - general:       overrides for general settings (e.g. enable_data_profiling)
#
# Run with:
#   python -m src.pipeline --config backend/config/pipelines/my_pipeline.yaml

jobs:
  # -----------------------------------------------------------------------
  # Job 1: Full pipeline — train, simulate and evaluate on a single dataset
  #         with job-specific rules and Mostly AI hyperparameters
  # -----------------------------------------------------------------------
  - name: "quick_test"
    config:
      mostly_ai:
        model_settings:
          max_epochs: 1
    train:
      files:
        - "data/sintetico omop/person.csv"
    simulate:
      sample_size: 100
    evaluate:
      real_data:
        - "data/sintetico omop/person.csv"

  - name: "full_pipeline_dataset_1"
    config:
      rules_config: "config/pipelines/rules/rules_pipeline_job1.yaml"
      mostly_ai:
        model_settings:
          max_epochs: 10
          batch_size: 24
    #   general:
    #     enable_data_profiling: true
    #     csv_delimiter: ","
    train:
      files:
        - "data/dataset_prueba_tecnica_v2.csv"
      sanity_only: false        # optional; true = apply only sanity-check rules
    simulate:
      sample_size: 1000
    evaluate:
      real_data:
        - "data/dataset_prueba_tecnica_v2.csv"

  # -----------------------------------------------------------------------
  # Job 2: Train + simulate with different rules and DP settings
  # -----------------------------------------------------------------------
  - name: "train_and_simulate_dataset_2"
    config:
      rules_config: "config/pipelines/rules/rules_pipeline_job2.yaml"
      mostly_ai:
        model_settings:
          differential_privacy:
            max_epsilon: 10
            noise_multiplier: 2.0
        general:
            enable_data_profiling: true
    train:
      files:
        - "data/dataset_prueba_tecnica_v2.csv"
    simulate:
      sample_size: 2000
    evaluate:
      real_data:
        - "data/dataset_prueba_tecnica_v2.csv"

  # -----------------------------------------------------------------------
  # Job 3: Train only (no simulation or evaluation)
  # -----------------------------------------------------------------------
  # - name: "train_only_dataset_3"
  #   train:
  #     files:
  #       - "data/sintetico/visit_occurrence.csv"

  # -----------------------------------------------------------------------
  # Job 4: Simulate from an existing model (no training needed)
  # -----------------------------------------------------------------------
  - name: "simulate_from_existing_model"
    simulate:
      model_id: "model_20260311_001613"   # existing model folder name
      sample_size: 500
    evaluate:
      real_data:
        - "data/sintetico/person.csv"

  # -----------------------------------------------------------------------
  # Job 5: Evaluate only (simulation already done)
  # -----------------------------------------------------------------------
  # - name: "evaluate_existing_simulation"
  #   evaluate:
  #     real_data:
  #       - "data/sintetico/person.csv"
  #     simulation_id: "simulation_20260304_183943"   # existing simulation folder name
  #     model_id: "model_20260227_092550"             # optional; used for MLflow lineage

  # -----------------------------------------------------------------------
  # Job 6: Multi-table dataset — pass a directory instead of individual files
  # -----------------------------------------------------------------------
  - name: "multi_table_dataset"
    train:
      files:
        - "data/sintetico/person.csv"           # directory — all supported files are loaded
        - "data/sintetico/visit_occurrence.csv"           # directory — all supported files are loaded
    simulate:
      sample_size: 1000
    evaluate:
      real_data:
        - "data/sintetico/person.csv"           # directory — all supported files are loaded
        - "data/sintetico/visit_occurrence.csv"           # directory — all supported files are loaded
