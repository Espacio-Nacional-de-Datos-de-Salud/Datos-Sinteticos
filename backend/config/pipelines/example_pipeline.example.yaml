# ======================================================================
# Example pipeline — annotated reference for new developers.
#
# Copy this file, rename it, and edit the jobs to match your data. Run:
#   make pipeline CONFIG=config/pipelines/<your_file>.yaml
#
# ----------------------------------------------------------------------
# Structure
# ----------------------------------------------------------------------
# A pipeline YAML has a single top-level key, `jobs`, listing jobs to
# execute sequentially. Each job may contain any combination of three
# steps: `train`, `simulate`, `evaluate`. Steps within a job always
# execute in that fixed order, and artifacts produced upstream
# (`model_id`, generator, metadata, rules) are passed automatically to
# the downstream steps of the same job — you do not need to wire them.
#
# Omit steps you don't need:
#   - train only          → only `train:`
#   - resume simulation   → only `simulate:` with `model_id`
#   - re-evaluate a run   → only `evaluate:` with `simulation_id`
#
# ----------------------------------------------------------------------
# Per-job `config:` (a.k.a. "side rules")
# ----------------------------------------------------------------------
# Each job may include an optional `config:` block that OVERRIDES global
# defaults FOR THAT JOB ONLY. Three keys are supported:
#
#   rules_config: <path>
#       Path to a job-specific rules YAML (same schema as
#       `config/rules.yaml`). Use it when a dataset needs its own
#       logical constraints (date inequalities, semantic rankings, etc.)
#       without polluting the global rules file.
#
#   mostly_ai: <dict>
#       DEEP-MERGED on top of `backend/config/mostly_ai.yaml`. Only
#       the keys you specify change; everything else keeps its default.
#       Typical uses:
#         - shorten runs for testing (max_epochs: 1)
#         - lower memory usage (batch_size: 24)
#         - tighten privacy (differential_privacy.max_epsilon)
#
#   general: <dict>
#       Overrides for values in `backend/config/general.yaml` that
#       are safe to toggle per job (e.g. enable_data_profiling, csv_delimiter).
#
# Rule of thumb: put stable defaults in the global config files and
# reserve `config:` overrides for per-dataset or per-experiment tweaks.
# ======================================================================

jobs:

  # --------------------------------------------------------------------
  # Job A — Happy path: train + simulate + evaluate on one dataset,
  #                     no overrides (uses all global defaults).
  # --------------------------------------------------------------------
  - name: "baseline_full_run"
    train:
      files:
        - "data/dataset_prueba_tecnica_v2.csv"
      # sanity_only: false   # (optional) true = skip training, run only
                             # the rule-based sanity checks on the input
    simulate:
      sample_size: 1000
    evaluate:
      real_data:
        - "data/dataset_prueba_tecnica_v2.csv"

  # --------------------------------------------------------------------
  # Job B — Custom rules + lightweight training for a fast smoke test.
  #
  # Demonstrates:
  #   - rules_config override (uses rules tailored to this dataset)
  #   - mostly_ai override (quick run: 1 epoch, small batch)
  #   - general override (enable profiling report)
  # --------------------------------------------------------------------
  - name: "smoke_test_with_overrides"
    config:
      rules_config: "config/pipelines/rules/rules_pipeline_job1.yaml"
      mostly_ai:
        model_settings:
          max_epochs: 1
          batch_size: 24
      general:
        enable_data_profiling: true
    train:
      files:
        - "data/dataset_prueba_tecnica_v2.csv"
    simulate:
      sample_size: 500
    evaluate:
      real_data:
        - "data/dataset_prueba_tecnica_v2.csv"

  # --------------------------------------------------------------------
  # Job C — High-privacy run with differential privacy overrides.
  #
  # The mostly_ai block deep-merges into mostly_ai.yaml: you only
  # need to list the keys that change. All other hyperparameters stay
  # at their defaults.
  # --------------------------------------------------------------------
  - name: "high_privacy_run"
    config:
      mostly_ai:
        model_settings:
          differential_privacy:
            max_epsilon: 5
            noise_multiplier: 2.0
    train:
      files:
        - "data/dataset_prueba_tecnica_v2.csv"
    simulate:
      sample_size: 2000
    evaluate:
      real_data:
        - "data/dataset_prueba_tecnica_v2.csv"

  # --------------------------------------------------------------------
  # Job D — Resume from a previously trained model (skip training).
  #
  # Supply an existing `model_id` under `simulate:`. The generator is
  # loaded from `outputs/models/<model_id>/` automatically.
  # Find valid IDs with: `make models`.
  # --------------------------------------------------------------------
  - name: "resimulate_from_existing_model"
    simulate:
      model_id: "model_20260311_001613"
      sample_size: 500
    evaluate:
      real_data:
        - "data/sintetico/person.csv"

  # --------------------------------------------------------------------
  # Job E — Re-evaluate an existing simulation (no training, no sim).
  #
  # Useful when metric definitions change and you want fresh numbers
  # without regenerating data. `model_id` is optional but recommended:
  # it links the evaluation to the original model in MLflow lineage.
  # Find valid IDs with: `make simulations` / `make models`.
  # --------------------------------------------------------------------
  - name: "reevaluate_existing_simulation"
    evaluate:
      real_data:
        - "data/sintetico/person.csv"
      simulation_id: "simulation_20260304_183943"
      model_id: "model_20260227_092550"

  # --------------------------------------------------------------------
  # Job F — Multi-table dataset.
  #
  # Pass multiple files (or a directory) under `train.files` and
  # `evaluate.real_data`. Mostly AI will learn inter-table relationships
  # using the PK/FK metadata resolved during preprocessing.
  # --------------------------------------------------------------------
  - name: "multi_table_run"
    train:
      files:
        - "data/sintetico/person.csv"
        - "data/sintetico/visit_occurrence.csv"
    simulate:
      sample_size: 1000
    evaluate:
      real_data:
        - "data/sintetico/person.csv"
        - "data/sintetico/visit_occurrence.csv"
