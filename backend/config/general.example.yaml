# ─────────────────────────────────────────────────────────────────────────────
# TEMPLATE — DO NOT EDIT THIS FILE.
# Run `make config` to create `general.yaml` (gitignored) from this template,
# then edit that file. The application only ever reads `general.yaml`.
# ─────────────────────────────────────────────────────────────────────────────

settings:
  enable_data_profiling: true
  default_csv_delimiter: ","
  default_sample_size: 1000
  synthetic_data_file_format: "csv"
  # Subfolder under ``<project_root>/data/`` used to resolve DEFAULT_DATA_PATH.
  # Empty string → data root; "whatever/" → <project_root>/data/whatever.
  data_subpath: ""

# Execution parameters consumed when the backend CLI is invoked
# directly without CLI arguments.
execution:
  mode: "i"            # "t" train, "s" simulate, "e" evaluate, "i" inspect
  file_paths: null     # list of paths; null/empty falls back to DEFAULT_DATA_PATH
  sample_size: null
  model_id: null
  simulation_id: null
  inspection_id: null
