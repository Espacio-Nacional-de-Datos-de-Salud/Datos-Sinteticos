# Reference examples for the rules editor. `rules.yaml` (gitignored) starts
# empty by default, and the application only ever reads that runtime file.
# ─────────────────────────────────────────────────────────────────────────────
# global config rules for rejection sampling
rejection_sampling:
  max_attempts: 5
  overgenerate_factor: 8.0

rules:
  - type: "date_inequality"
    table_origin: "procedure_occurrence"
    origin_col: "procedure_datetime"
    table_target: "procedure_occurrence"
    target_col: "procedure_end_datetime"
    aux_col: "procedure_duration_days"
    # Optional: enforce_non_negative (default: true)
    # Set to false to allow the model to generate negative durations

  - type: "date_inequality"
    table_origin: "dataset_prueba_tecnica_v2"
    origin_col: "admittime"
    table_target: "dataset_prueba_tecnica_v2"
    target_col: "dischtime"
    enforce_non_negative: true

  - type: "date_inequality"
    table_origin: "dataset_prueba_tecnica_v2"
    origin_col: "dob"
    table_target: "dataset_prueba_tecnica_v2"
    target_col: "admittime"
    # This one allows negative durations (for ages in the future, for example)
    enforce_non_negative: false

  - type: "semantic_ranking_consistency"
    table_origin: "dataset_prueba_tecnica_v2"
    origin_col: "admission_type"
    table_target: "dataset_prueba_tecnica_v2"
    target_col: "expire_flag"

  - type: "date_to_age"
    table_origin: "dataset_prueba_tecnica_v2"
    origin_col: "dob"
    table_target: "dataset_prueba_tecnica_v2"
    target_col: "age_at_admission"
    reference_date_col: "admittime"

  - type: "numeric_threshold"
    table_origin: "dataset_prueba_tecnica_v2"
    table_target: "dataset_prueba_tecnica_v2"
    origin_col: "age"
    target_col: "age"
    threshold: 18
    operator: ">="
    rejection_sampling: true

  - type: "numeric_threshold"
    table_origin: "dataset_prueba_tecnica_v2"
    origin_col: "age_at_admission"
    table_target: "dataset_prueba_tecnica_v2"
    target_col: "is_adult"
    threshold: 18
    operator: ">="

  - type: "numeric_bucket"
    table_origin: "dataset_prueba_tecnica_v2"
    origin_col: "age"
    table_target: "dataset_prueba_tecnica_v2"
    target_col: "age_group"
    bins: [0, 18, 65, 120]
    labels: ["minor", "adult", "senior"]

  - type: "date_composition"
    table_target: "dataset_prueba_tecnica_v2"
    canonical_col: "dob"
    part_cols:
      year: "dob_year"
      month: "dob_month"
      day: "dob_day"
