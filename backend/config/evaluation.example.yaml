# ─────────────────────────────────────────────────────────────────────────────
# TEMPLATE — DO NOT EDIT THIS FILE.
# Run `make config` to create `evaluation.yaml` (gitignored) from this
# template, then edit that file. The application only reads `evaluation.yaml`.
# ─────────────────────────────────────────────────────────────────────────────

execution:
  drop_id_columns_from_metrics: true  # detects and drops id / primary-foreign keys

metrics:
  default:
    custom:
      - dcr
      - nndr
      - correlation_matrix_distance
      - distribution_comparison_report
    sanity:
      - common_rows_proportion
    stats:
      - jensenshannon_dist
      - inv_kl_divergence
    performance:
      - linear_model
      - mlp
    detection:
      - detection_mlp
    privacy:
      - k-anonymization
      - distinct l-diversity
      # - DomiasMIA_BNAF  # Membership inference attack - VERY HEAVY

  # Exact-match (EMR) options. When show_filtered_rows is true and
  # exact_match_rows is enabled, the report lists the real rows that the
  # synthetic data copied verbatim. Off by default — those are real records.
  exact_match:
    show_filtered_rows: false

  # Subsets of quasi-identifiers for k-anonymity and l-diversity.
  # k-anonymity falls back to pairwise combinations if null.
  # l-diversity is skipped if this is null, because all-pairs l-diversity is
  # too expensive and not semantically useful without explicit QI choices.
  quasi_identifier_subsets:
    demographics:
      - GENDER
      - MARITAL_STATUS
      - ETHNICITY_GROUPED
    admission_context:
      - ADMISSION_TYPE
      - INSURANCE
    discharge_context:
      - ADMISSION_TYPE
      - INSURANCE

  # Sensitive columns used by l-diversity. If null/empty, l-diversity is skipped.
  sensitive_columns:
    - EXPIRE_FLAG

  tvd_n_bins: 10

  tstr:
    target_column: "expire_flag"
    task_type: "classification"

  # ──────────────────────────────────────────────────────────────────────────
  # STATISTICAL UTILITY (utility_tests)
  # ──────────────────────────────────────────────────────────────────────────
  # Compares user-defined aggregations between real and synthetic data. Each
  # test reports the real value, synthetic value, a symmetric relative
  # discrepancy (|s - r| / (|s| + |r|), in 0..1) and a relative precision
  # (1 - discrepancy, in 0..1). The axis score is the weighted mean of the
  # per-test precisions. Disabled by default; enable and add tests.
  #
  # Per-test keys:
  #   name           label shown in the report
  #   metric         count | proportion | mean | median | sum | std | min | max |
  #                  nunique | percentile | rate | ratio | custom_formula
  #   table          table the aggregation runs on
  #   column         required for column metrics (mean, std, percentile, …)
  #   filter         optional pandas query, e.g. "EXPIRE_FLAG == 1"
  #   percentile     required for metric: percentile (0–1)
  #   formula        required for metric: custom_formula — an expression over the
  #                  filtered table exposed as `df` (plus np, pd), e.g.
  #                  "df['charges'].sum() / df['age'].mean()"
  #   weight         optional contribution to the weighted mean (default 1.0)
  #   rate/ratio     carry nested `numerator` and `denominator` metric specs
  utility_tests:
    enabled: false
    tests:
      - name: "Proporción de fallecidos"
        metric: "proportion"
        table: "dataset_prueba_tecnica_v2"
        filter: "EXPIRE_FLAG == 1"
        weight: 1.0
      - name: "Edad media"
        metric: "mean"
        table: "dataset_prueba_tecnica_v2"
        column: "age"
      - name: "Coste medio por día de estancia"
        metric: "custom_formula"
        table: "dataset_prueba_tecnica_v2"
        formula: "df['charges'].sum() / df['length_of_stay'].sum()"
