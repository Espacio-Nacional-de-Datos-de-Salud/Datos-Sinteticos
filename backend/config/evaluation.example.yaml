# ─────────────────────────────────────────────────────────────────────────────
# TEMPLATE — DO NOT EDIT THIS FILE.
# Run `make config` to create `evaluation.yaml` (gitignored) from this
# template, then edit that file. The application only reads `evaluation.yaml`.
# ─────────────────────────────────────────────────────────────────────────────

execution:
  drop_id_columns_from_metrics: true  # detects and drops id / primary-foreign keys

metrics:
  default:
    custom:
      - dcr
      - nndr
      - correlation_matrix_distance
      - confidence_interval_overlap
      - distribution_comparison_report
    sanity:
      - common_rows_proportion
    stats:
      - jensenshannon_dist
      - inv_kl_divergence
    performance:
      - linear_model
      - mlp
    detection:
      - detection_mlp
    privacy:
      - k-anonymization
      - distinct l-diversity
      # - DomiasMIA_BNAF  # Membership inference attack - VERY HEAVY

  # Subsets of quasi-identifiers for k-anonymity and l-diversity.
  # k-anonymity falls back to pairwise combinations if null.
  # l-diversity is skipped if this is null, because all-pairs l-diversity is
  # too expensive and not semantically useful without explicit QI choices.
  quasi_identifier_subsets:
    demographics:
      - GENDER
      - MARITAL_STATUS
      - ETHNICITY_GROUPED
    admission_context:
      - ADMISSION_TYPE
      - INSURANCE
    discharge_context:
      - ADMISSION_TYPE
      - INSURANCE

  # Sensitive columns used by l-diversity. If null/empty, l-diversity is skipped.
  sensitive_columns:
    - EXPIRE_FLAG

  confidence_interval_level: 0.95
  num_bootstrap_samples: 1000
  tvd_n_bins: 10

  tstr:
    target_column: "expire_flag"
    task_type: "classification"

# ============================================================================
# STATISTICS
# ============================================================================
# Built-in operations: mean, median, mode, variance, skewness, kurtosis,
# range, quantile. All get bootstrap 95% CIs.
#
# Formula-based: operation "custom_formula" with formula key; use {col} as
# placeholder. Supported: np, pd, min, max, sum, mean, std, var.
#
# Custom statistics: require CUSTOM_STATISTICS_MODULE env var pointing at a
# module of Statistic subclasses (e.g.
# src.evaluation.custom_metrics.custom_statistics).
statistics:
  - operation: "mean"
    table: "dataset_prueba_tecnica_v2"
    col: "gender"

  - operation: "median"
    table: "dataset_prueba_tecnica_v2"
    col: "gender"

  - operation: "mode"
    table: "dataset_prueba_tecnica_v2"
    col: "gender"

  - operation: "variance"
    table: "dataset_prueba_tecnica_v2"
    col: "gender"

  - operation: "skewness"
    table: "dataset_prueba_tecnica_v2"
    col: "gender"

  - operation: "kurtosis"
    table: "dataset_prueba_tecnica_v2"
    col: "gender"

  - operation: "quantile"
    table: "dataset_prueba_tecnica_v2"
    col: "gender"
    quantile: 0.25

  - operation: "quantile"
    table: "dataset_prueba_tecnica_v2"
    col: "gender"
    quantile: 0.75

  - operation: "age"
    table: "dataset_prueba_tecnica_v2"
    convert_to_categorical: False
    columns: {"col": "dob", "col2": "admittime"}
